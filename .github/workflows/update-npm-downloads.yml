name: Update npm downloads

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-npm-downloads
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Test statistics updater
        run: node --test .github/actions/update-npm-downloads/update.test.mjs
      - uses: ./.github/actions/update-npm-downloads
        with:
          target: profile
      - name: Commit and publish profile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit --allow-empty -m 'docs: refresh npm download totals'
          git push origin HEAD:main
